[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketpred"
version = "0.1.0"
description = "Multi-factor market prediction research system with point-in-time data and walk-forward validation"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<2.3", "pandas>=2.2,<2.4", "pyarrow>=15", "scipy>=1.12",
  "scikit-learn>=1.4,<1.8", "lightgbm>=4.3,<5", "xgboost>=2.0,<4", "arch>=7.0",
  "statsmodels>=0.14", "ephem>=4.1", "pandas_market_calendars>=4.4",
  "pydantic>=2.6,<3", "PyYAML>=6", "requests>=2.31", "truststore>=0.9",
  "xlrd>=2.0", "openpyxl>=3.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
marketpred = "marketpred.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: requires internet access (deselect with -m 'not network')"]
